<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">Product screenshot placeholders</title>
  <desc id="desc">Three labeled frames show where anonymized dashboard, meter health, and report screenshots should be placed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081526"/><stop offset="1" stop-color="#122941"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <style>
      .head { font: 700 26px 'Segoe UI',Arial,sans-serif; fill: #f1f6fb }
      .sub { font: 400 14px 'Segoe UI',Arial,sans-serif; fill: #9eb3c8 }
      .card { font: 650 16px 'Segoe UI',Arial,sans-serif; fill: #eef5fb }
      .file { font: 500 12px 'Consolas',monospace; fill: #6ee7c0 }
      .hint { font: 400 12px 'Segoe UI',Arial,sans-serif; fill: #8fa7bd }
    </style>
  </defs>
  <rect width="1440" height="600" rx="26" fill="url(#bg)"/>
  <circle cx="1290" cy="70" r="230" fill="#0e7490" opacity=".12"/>
  <text x="58" y="62" class="sub" letter-spacing="2">PRODUCT TOUR</text>
  <text x="58" y="103" class="head">Replace these panels with your application captures</text>
  <text x="58" y="132" class="sub">Use fictional or approved anonymized data. Exact capture instructions are in docs/SHOWCASE_ASSETS.md.</text>

  <g>
    <rect x="58" y="170" width="420" height="330" rx="18" fill="#10243a" stroke="#294760"/>
    <rect x="58" y="170" width="420" height="7" rx="3.5" fill="url(#glow)"/>
    <rect x="82" y="198" width="372" height="220" rx="10" fill="#0a1728" stroke="#263f56" stroke-dasharray="7 7"/>
    <circle cx="268" cy="285" r="29" fill="#16344b" stroke="#2c5b72"/>
    <path d="M253 286h30M268 271v30" stroke="#54c7d5" stroke-width="3" stroke-linecap="round"/>
    <text x="268" y="346" text-anchor="middle" class="hint">Dashboard overview screenshot</text>
    <text x="82" y="451" class="card">01  Dashboard</text>
    <text x="82" y="475" class="file">dashboard-overview.png</text>

    <rect x="510" y="170" width="420" height="330" rx="18" fill="#10243a" stroke="#294760"/>
    <rect x="510" y="170" width="420" height="7" rx="3.5" fill="url(#glow)"/>
    <rect x="534" y="198" width="372" height="220" rx="10" fill="#0a1728" stroke="#263f56" stroke-dasharray="7 7"/>
    <circle cx="720" cy="285" r="29" fill="#16344b" stroke="#2c5b72"/>
    <path d="M705 286h30M720 271v30" stroke="#54c7d5" stroke-width="3" stroke-linecap="round"/>
    <text x="720" y="346" text-anchor="middle" class="hint">Meter status and freshness screenshot</text>
    <text x="534" y="451" class="card">02  Meter health</text>
    <text x="534" y="475" class="file">meter-health.png</text>

    <rect x="962" y="170" width="420" height="330" rx="18" fill="#10243a" stroke="#294760"/>
    <rect x="962" y="170" width="420" height="7" rx="3.5" fill="url(#glow)"/>
    <rect x="986" y="198" width="372" height="220" rx="10" fill="#0a1728" stroke="#263f56" stroke-dasharray="7 7"/>
    <circle cx="1172" cy="285" r="29" fill="#16344b" stroke="#2c5b72"/>
    <path d="M1157 286h30M1172 271v30" stroke="#54c7d5" stroke-width="3" stroke-linecap="round"/>
    <text x="1172" y="346" text-anchor="middle" class="hint">Excel or Word report screenshot</text>
    <text x="986" y="451" class="card">03  Report preview</text>
    <text x="986" y="475" class="file">report-preview.png</text>
  </g>
  <text x="58" y="555" class="hint">Swap in product screenshots only after removing real site names, meter identifiers, network details, and personal information.</text>
</svg>
