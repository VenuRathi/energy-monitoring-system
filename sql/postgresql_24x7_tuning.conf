# PostgreSQL 24x7 energy-monitoring tuning template.
# Copy the relevant block into postgresql.conf after confirming machine RAM.
# Restart PostgreSQL after changes that require restart.

# Edge PC baseline, 8 GB RAM
# shared_buffers = 2GB
# effective_cache_size = 6GB
# work_mem = 16MB
# maintenance_work_mem = 512MB
# max_wal_size = 4GB
# min_wal_size = 1GB
# checkpoint_timeout = 15min
# checkpoint_completion_target = 0.9
# wal_buffers = 16MB
# autovacuum = on
# autovacuum_naptime = 30s
# autovacuum_vacuum_scale_factor = 0.05
# autovacuum_analyze_scale_factor = 0.02
# log_checkpoints = on
# log_autovacuum_min_duration = 1000
# log_min_duration_statement = 5000

# Central PC baseline, 16 GB RAM
# shared_buffers = 4GB
# effective_cache_size = 12GB
# work_mem = 64MB
# maintenance_work_mem = 1GB
# max_wal_size = 8GB
# min_wal_size = 2GB
# checkpoint_timeout = 15min
# checkpoint_completion_target = 0.9
# wal_buffers = 32MB
# autovacuum = on
# autovacuum_max_workers = 4
# autovacuum_naptime = 30s
# autovacuum_vacuum_scale_factor = 0.05
# autovacuum_analyze_scale_factor = 0.02
# log_checkpoints = on
# log_autovacuum_min_duration = 1000
# log_min_duration_statement = 5000
